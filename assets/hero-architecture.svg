<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect width="1120" height="520" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="0" y="0" width="1120" height="4" rx="2" fill="url(#cyanGreen)"/>

  <!-- Top Banner -->
  <text x="36" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800">🧬 EvoKernel Architecture — Deterministic Self-Evolving Meta-Kernel for AI Coding Agents</text>
  <text x="36" y="64" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Zero External Dependencies  •  -94.4% Prompt Schema Tax  •  100% Prompt-Cache Prefix Preservation  •  AST Anti-Drift Memory</text>

  <!-- COLUMN 1: 10 AI Coding Harnesses -->
  <rect x="28" y="88" width="236" height="404" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="46" y="118" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="800">1. MULTI-HARNESS HOSTS (10)</text>
  <text x="46" y="138" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Unified L0 Seed + Lifecycle Hooks</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e2e8f0">
    <rect x="44" y="152" width="204" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="56" y="170">⚡ Claude Code (.claude)</text>

    <rect x="44" y="186" width="204" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="56" y="204">🎯 Cursor (.cursor/rules)</text>

    <rect x="44" y="220" width="204" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="56" y="238">🚀 Antigravity / Gemini CLI</text>

    <rect x="44" y="254" width="204" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="56" y="272">🧠 OpenAI Codex (.codex)</text>

    <rect x="44" y="288" width="204" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="56" y="306">🌊 Windsurf &amp; Cline / Roo</text>

    <rect x="44" y="322" width="204" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="56" y="340">🐙 GitHub Copilot &amp; OpenCode</text>
  </g>

  <rect x="44" y="366" width="204" height="110" rx="8" fill="#090d16" stroke="#0284c7" stroke-dasharray="4 3"/>
  <text x="56" y="388" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Always-On Footprint:</text>
  <text x="56" y="408" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">• L0 Seed: ~1,150 tokens</text>
  <text x="56" y="426" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">• 5 Meta-Tools: ~380 tokens</text>
  <text x="56" y="446" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">✓ 100% Static Cache Prefix</text>
  <text x="56" y="464" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">✓ 0 Schema Mutation Busts</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="264" y1="245" x2="302" y2="245" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <line x1="302" y1="395" x2="264" y2="395" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- COLUMN 2: 5-Tool Meta-MCP Gateway & Deterministic Gatekeeper -->
  <rect x="306" y="88" width="448" height="224" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.8"/>
  <text x="326" y="118" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">2. SINGLE 5-TOOL META-MCP GATEWAY (stdio JSON-RPC 2.0)</text>
  <text x="326" y="138" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5">Folds 50+ third-party MCP tools &amp; repo knowledge behind 5 immutable primitives:</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <rect x="324" y="150" width="200" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="336" y="168" fill="#38bdf8" font-weight="700">evo_search(query)</text>
    <text x="336" y="184" fill="#94a3b8" font-size="10">FTS5 BM25 + CJK/EN Synonym Recall</text>

    <rect x="536" y="150" width="200" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="548" y="168" fill="#38bdf8" font-weight="700">evo_inspect(id, L1|L2)</text>
    <text x="548" y="184" fill="#94a3b8" font-size="10">Lazy Schema, SOP &amp; AST Callers</text>

    <rect x="324" y="200" width="200" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="336" y="218" fill="#38bdf8" font-weight="700">evo_run(tool_id, args)</text>
    <text x="336" y="234" fill="#94a3b8" font-size="10">Sandboxed Micro-Tools &amp; MCP Proxy</text>

    <rect x="536" y="200" width="200" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="548" y="218" fill="#34d399" font-weight="700">evo_propose / compact</text>
    <text x="548" y="234" fill="#94a3b8" font-size="10">Autonomous Capability Crystallization</text>
  </g>

  <rect x="324" y="252" width="412" height="46" rx="6" fill="#0c192c" stroke="#1e3a8a"/>
  <text x="338" y="272" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">🔌 Downstream MCP Pool (.evo/mcp-pool.json):</text>
  <text x="338" y="289" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">GitHub • Playwright • Postgres • Sentry • Linear • Context7 (0 Eager Schema Tokens)</text>

  <!-- Gatekeeper Box (Bottom Center) -->
  <rect x="306" y="326" width="448" height="166" rx="12" fill="url(#gateGrad)" stroke="#34d399" stroke-width="1.8"/>
  <text x="326" y="354" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">3. DETERMINISTIC 4-STAGE GATEKEEPER &amp; WORKTREE EVOLUTION</text>
  <text x="326" y="374" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5">Every proposed Rule, Skill, Tool, or Memory must pass 4 hard verification gates:</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ecfdf5">
    <rect x="324" y="386" width="198" height="40" rx="5" fill="#062c22" stroke="#10b981"/>
    <text x="334" y="403" font-weight="700" fill="#34d399">Gate 1: Static &amp; De-Symbol</text>
    <text x="334" y="418" fill="#a7f3d0">Blocks secrets &amp; magic-number rules</text>

    <rect x="536" y="386" width="200" height="40" rx="5" fill="#062c22" stroke="#10b981"/>
    <text x="546" y="403" font-weight="700" fill="#34d399">Gate 2: AST &amp; --self-test</text>
    <text x="546" y="418" fill="#a7f3d0">Verifies live symbols &amp; tool exit(0)</text>

    <rect x="324" y="434" width="198" height="42" rx="5" fill="#062c22" stroke="#10b981"/>
    <text x="334" y="451" font-weight="700" fill="#34d399">Gate 3: BM25 &amp; Causal Check</text>
    <text x="334" y="466" fill="#a7f3d0">Rejects duplicates &amp; confounded runs</text>

    <rect x="536" y="434" width="200" height="42" rx="5" fill="#062c22" stroke="#10b981"/>
    <text x="546" y="451" font-weight="700" fill="#34d399">Gate 4: Token &amp; Pareto Gate</text>
    <text x="546" y="466" fill="#a7f3d0">1,500-tok cap + Git worktree probe</text>
  </g>

  <!-- Arrow Col 2 -> Col 3 -->
  <line x1="754" y1="210" x2="792" y2="210" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <line x1="754" y1="410" x2="792" y2="410" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- COLUMN 3: .evo/ Cognitive Memory & Capability Tree -->
  <rect x="796" y="88" width="296" height="404" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="814" y="118" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="800">4. GIT-TRACKED .evo/ BRAIN</text>
  <text x="814" y="138" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Zero-Bloat Tiered Knowledge &amp; Telemetry</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="814" y="152" width="260" height="68" rx="7" fill="#090d16" stroke="#34d399"/>
    <text x="826" y="172" fill="#34d399" font-weight="700">🧠 .evo/memories/ (0 Core Tax)</text>
    <text x="826" y="190" fill="#cbd5e1" font-size="10.5">AST Structural Hashes + Git Topology</text>
    <text x="826" y="206" fill="#94a3b8" font-size="10">[VERIFIED] vs [OTHER_BRANCH] vs [STALE]</text>

    <rect x="814" y="230" width="260" height="62" rx="7" fill="#090d16" stroke="#818cf8"/>
    <text x="826" y="250" fill="#818cf8" font-weight="700">🛡️ .evo/rules/ (Core &amp; Scoped)</text>
    <text x="826" y="268" fill="#cbd5e1" font-size="10.5">1-Level-Up Architectural Invariants</text>
    <text x="826" y="282" fill="#94a3b8" font-size="10">Glob-routed (max 3/bucket, ≤1500 tok)</text>

    <rect x="814" y="302" width="260" height="58" rx="7" fill="#090d16" stroke="#38bdf8"/>
    <text x="826" y="322" fill="#38bdf8" font-weight="700">⚡ .evo/skills/ &amp; .evo/tools/</text>
    <text x="826" y="340" fill="#cbd5e1" font-size="10.5">L1/L2 Progressive SOPs &amp; Micro-Tools</text>
    <text x="826" y="352" fill="#94a3b8" font-size="10">Deliverable Inspector (.xlsx/.docx/.pptx)</text>

    <rect x="814" y="370" width="260" height="106" rx="7" fill="#090d16" stroke="#fbbf24"/>
    <text x="826" y="390" fill="#fbbf24" font-weight="700">📊 Native node:sqlite (WAL + FTS5)</text>
    <text x="826" y="408" fill="#cbd5e1" font-size="10.5">• Causal Outcome Attribution</text>
    <text x="826" y="424" fill="#cbd5e1" font-size="10.5">• Helped / Hurt / Contested ROI</text>
    <text x="826" y="440" fill="#cbd5e1" font-size="10.5">• Live Cockpit UI (`npx evo-kernel ui`)</text>
    <text x="826" y="458" fill="#34d399" font-size="10.5" font-weight="700">• Instant X-Ray (`npx evo-kernel score`)</text>
  </g>
</svg>
