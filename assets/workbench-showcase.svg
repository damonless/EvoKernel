        <text x="0" y="12" fill="#8b8b95" font-size="10" font-weight="700" letter-spacing="0.06em">TL;DR SUMMARY</text>
        <rect y="20" width="318" height="48" rx="6" fill="#141418" stroke="#27272a" stroke-width="1"/>
        <text x="12" y="39" fill="#fafafa" font-size="10.5">Root "/" route stripped to empty string → 308 loop</text>
        <text x="12" y="56" fill="#8b8b95" font-size="10">Guard "/" before trimming leading/trailing slashes.</text>
      </g>

      <!-- Symptom / Root Cause / Solution Triad -->
      <g transform="translate(16, 168)">
        <text x="0" y="12" fill="#8b8b95" font-size="10" font-weight="700" letter-spacing="0.06em">DIAGNOSTIC TRIAD</text>

        <g transform="translate(0, 20)">
          <rect width="318" height="62" rx="6" fill="#141418" stroke="#27272a" stroke-width="1"/>
          <text x="12" y="18" fill="#f87171" font-size="9.5" font-weight="700">SYMPTOM</text>
          <text x="12" y="35" fill="#d4d4d8" font-size="10.5">GET / entered an infinite 308 redirect loop when</text>
          <text x="12" y="50" fill="#d4d4d8" font-size="10.5">trailing-slash normalization ran pre-dispatch.</text>
        </g>

        <g transform="translate(0, 90)">
          <rect width="318" height="62" rx="6" fill="#141418" stroke="#27272a" stroke-width="1"/>
          <text x="12" y="18" fill="#f59e0b" font-size="9.5" font-weight="700">ROOT CAUSE</text>
          <text x="12" y="35" fill="#d4d4d8" font-size="10.5">Unconditional slash stripping turned "/" into "",</text>
          <text x="12" y="50" fill="#d4d4d8" font-size="10.5">re-triggering canonical redirect on each request.</text>
        </g>

        <g transform="translate(0, 160)">
          <rect width="318" height="62" rx="6" fill="#141418" stroke="#27272a" stroke-width="1"/>
          <text x="12" y="18" fill="#34d399" font-size="9.5" font-weight="700">VERIFIED SOLUTION</text>
          <text x="12" y="35" fill="#d4d4d8" font-size="10.5">Return "/" early when trimmed path is "/" or empty,</text>
          <text x="12" y="50" fill="#d4d4d8" font-size="10.5">then prefix single "/" on normalized segments.</text>
        </g>
      </g>

      <!-- AST Code Anchors -->
      <g transform="translate(16, 408)">
        <text x="0" y="12" fill="#8b8b95" font-size="10" font-weight="700" letter-spacing="0.06em">AST* SYMBOL ANCHORS (2/2 FRESH)</text>
