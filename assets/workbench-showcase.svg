          <text x="12" y="21" fill="#fafafa" font-size="11" font-family="'Cascadia Code', monospace">src/router.ts:1-6</text>
          <rect x="242" y="8" width="64" height="17" rx="4" fill="rgba(16,185,129,0.14)"/>
          <text x="274" y="20" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="700">VERIFIED</text>
          <text x="12" y="39" fill="#8b8b95" font-size="10" font-family="'Cascadia Code', monospace">fn normalizeRoutePath(rawPath)</text>
          <text x="12" y="55" fill="#38bdf8" font-size="10" font-family="'Cascadia Code', monospace">↳ Caller: src/router.ts:8 (#dispatchRequest)</text>
