  <!-- Window Top Bar -->
  <circle cx="28" cy="28" r="5.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="46" cy="28" r="5.5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="64" cy="28" r="5.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="86" y="33" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.02em">EvoKernel Workbench X-Ray</text>
  <text x="304" y="33" fill="#64748b" font-family="'Cascadia Code', Consolas, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">workspace: EvoKernel  ·  npx evo-kernel score</text>
  <rect x="786" y="15" width="124" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
