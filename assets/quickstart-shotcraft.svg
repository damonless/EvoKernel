              <text x="18" y="28" class="sans" font-size="13" font-weight="800" fill="#ffffff">🌐 Live Obsidian Cockpit Server</text>
              <rect x="18" y="40" width="310" height="26" rx="6" fill="#04060a" stroke="rgba(56,189,248,0.3)"/>
              <text x="28" y="57" class="mono" font-size="12" font-weight="700" fill="#38bdf8">http://127.0.0.1:4310</text>
              <rect x="340" y="40" width="160" height="26" rx="6" fill="rgba(16,185,129,0.2)"/>
              <text x="420" y="57" class="mono" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle">Watch 30s Film</text>
              <text x="18" y="90" class="mono" font-size="10.5" fill="#94a3b8">Zero-write telemetry &amp; 2D token budget treemap</text>
