              <text x="18" y="28" class="sans" font-size="13" font-weight="800" fill="#ffffff">📊 Native node:sqlite Telemetry Store</text>
              <text x="18" y="52" class="mono" font-size="11" fill="#cbd5e1">WAL Mode • FTS5 Full-Text • Causal ROI Tracker</text>
              <text x="18" y="72" class="mono" font-size="10.5" fill="#34d399">✓ 16/16 AST Memories Verified in &lt;0.05ms</text>
              <text x="18" y="90" class="mono" font-size="10" fill="#64748b">Press 'q' or Ctrl+C in terminal to stop server</text>
