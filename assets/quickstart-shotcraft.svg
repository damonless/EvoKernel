          <!-- Top Card: Canonical Deliverable Verification -->
          <g transform="translate(0, 0)">
            <rect width="1056" height="88" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.35)"/>
            <circle cx="28" cy="28" r="10" fill="#10b981"/>
            <text x="28" y="32" class="mono" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
            <text x="50" y="32" class="sans" font-size="14" font-weight="800" fill="#ffffff">Canonical Deliverable Inspection: <tspan fill="#34d399">PASSED (0 Defects)</tspan></text>
            <text x="50" y="54" class="mono" font-size="11" fill="#cbd5e1">Target: ./report.xlsx (4 worksheets, 1,280 cells, zero formula drift)</text>
