name: Publish to npm (evo-kernel)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. latest or next)'
        required: false
        default: 'latest'

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Verify & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js 22 (npmjs.org)"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build & Run Gatekeeper Verification Suite
        run: |
          npm run build
          npm test
          node ./.evo/tools/agy-config-auditor/run.mjs

      - name: Publish Package to npm
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VER="$(npm view "evo-kernel@$PKG_VERSION" version 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -n "$PKG_VERSION" ] && [ "$PUBLISHED_VER" = "$PKG_VERSION" ]; then
            echo "Notice: evo-kernel@$PKG_VERSION is already published on npm. Skipping publish idempotently."
            exit 0
          fi
          CLEAN_TOKEN="$(printf '%s' "$RAW_NPM_TOKEN" | grep -oE 'npm_[A-Za-z0-9]{20,}' | head -n 1 || true)"
          if [ -z "$CLEAN_TOKEN" ]; then
            CLEAN_TOKEN="$(printf '%s' "$RAW_NPM_TOKEN" | sed 's/^.*_authToken=//; s/^Bearer[[:space:]]*//' | tr -d '[:space:]')"
          fi
          rm -f README.zh-CN.md
          NODE_AUTH_TOKEN="$CLEAN_TOKEN" npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Notice: GitHub Release $TAG_NAME already exists. Skipping creation idempotently."
            exit 0
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          NOTES_FILE="$(mktemp)"
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            const out = process.argv[2];
            if (!fs.existsSync("CHANGELOG.md")) process.exit(0);
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => l.startsWith(`## [${ver}]`));
            if (start >= 0) {
              const rest = lines.slice(start + 1);
              const endRel = rest.findIndex((l) => /^## \[/.test(l));
              const slice = (endRel >= 0 ? rest.slice(0, endRel) : rest).join("\n").trim();
              if (slice) fs.writeFileSync(out, slice + "\n");
            }
          ' "$PKG_VERSION" "$NOTES_FILE"
          PRERELEASE_FLAG=""
          if printf '%s' "$TAG_NAME" | grep -q '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          else
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --generate-notes $PRERELEASE_FLAG
          fi
          rm -f "$NOTES_FILE"
