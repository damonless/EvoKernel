name: Deploy EvoKernel Cockpit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout: Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup: Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Build: ESM Bundle"
        run: npm run build

      - name: "Export: UI Cockpit"
        run: |
          mkdir -p public
          node ./dist/cli/index.js ui --export public/index.html --anon

      - name: "Pages: Setup"
        id: pages_setup
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: "Pages: Upload Artifact"
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: "Pages: Deploy"
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "Pages: Skipped Notice"
        if: steps.pages_setup.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages Not Enabled::GitHub Pages is not yet enabled in repository settings (Settings -> Pages -> Build and deployment -> Source: GitHub Actions). Static UI cockpit export succeeded at ./public/index.html."
