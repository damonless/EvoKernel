name: Deploy EvoKernel Cockpit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout: Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup: Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Build: ESM Bundle"
        run: npm run build

      - name: "Export: UI Cockpit"
        run: |
          mkdir -p public
          node ./dist/cli/index.js ui --export public/index.html --anon

      - name: "Pages: Setup"
        uses: actions/configure-pages@v5

      - name: "Pages: Upload Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: "Pages: Deploy"
        id: deployment
        uses: actions/deploy-pages@v4
